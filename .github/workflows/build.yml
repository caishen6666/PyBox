name: Build PyBox APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good openjdk-17-jdk unzip autoconf automake libtool libltdl-dev pkg-config libssl-dev libncurses-dev libtcmalloc-minimal4

      - name: Install buildozer & cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      # libffi 3.4.2 (p4a recipe) 与 autoconf 2.72 不兼容（LT_SYS_SYMBOL_USCORE 报错），改用 2.71
      - name: Install autoconf 2.71
        run: |
          cd /tmp
          curl -sL -o autoconf.tar.gz https://ftp.gnu.org/gnu/autoconf/autoconf-2.71.tar.gz
          tar xzf autoconf.tar.gz
          cd autoconf-2.71
          ./configure --prefix=$HOME/autoconf-2.71 > /dev/null
          make -j2 > /dev/null
          make install > /dev/null
          echo "$HOME/autoconf-2.71/bin" >> $GITHUB_PATH
          $HOME/autoconf-2.71/bin/autoconf --version | head -1

      - name: Build APK
        run: |
          yes | buildozer android debug || buildozer android debug
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyBox-APK
          path: bin/*.apk
          if-no-files-found: error
